name: MCU subsystem source and PCB checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/pcb/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen PCB tooling
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --prefix tools/pcb --legacy-peer-deps --no-audit --no-fund
          (cd tools/pcb && sha256sum --check trace-linter.sha256)
          ln -s tools/pcb/node_modules node_modules
          echo "$GITHUB_WORKSPACE/tools/pcb/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check source and native subsystem
        run: |
          npm run typecheck
          npm run core:build
          npm run core:check
          npm run controller:build
          npm run controller:check
          python3 scripts/schematic_core.py
          bun scripts/render-core.tsx
          tsci check schematic-placement artifacts/rp2040-core/core-schematic.circuit.json > artifacts/rp2040-core/native-schematic-placement.txt
          python3 scripts/verify_core_schematic.py
          npm test
      - name: Check native PCB and independent copper geometry
        run: |
          python3 -m pip install numpy==2.3.5 shapely==2.1.2
          bun scripts/schematic-controller.tsx
          python3 scripts/verify_controller_schematic.py
          tsci check schematic-placement artifacts/controller/schematic.circuit.json > artifacts/controller/native-schematic-placement.txt
          git diff --exit-code -- artifacts/controller/schematic.circuit.json
          python3 scripts/route_core_pcb.py
          bun scripts/check-render-pcb.tsx
          python3 scripts/audit_core_pcb.py
          python3 scripts/audit_core_clock.py
          python3 -m unittest discover -s tests-pcb -v
          git diff --exit-code -- artifacts/rp2040-pcb/board.circuit.json
      - name: Reproduce and independently check full controller PCB
        run: |
          python3 scripts/build_controller_pcb.py --check
          bun scripts/check-controller-pcb.tsx --checks-only --report-only
          python3 scripts/audit_controller_pcb.py
          python3 scripts/audit_core_clock.py --controller
          python3 scripts/review_controller_native_drc.py
      - name: Independently parse committed review CAM and verify prototype
        run: |
          python3 -m pip install -r tools/requirements-cam.lock
          python3 scripts/audit_core_cam.py
          python3 scripts/prepare-core-prototype.py
          (cd prototypes/rp2040-core && tsci build index.circuit.json)
          python3 scripts/verify_core_prototype.py
          git diff --exit-code -- prototypes/rp2040-core/index.circuit.json
      - name: Verify committed native source reproduces
        run: |
          git diff --exit-code -- artifacts/rp2040-core/core.circuit.json artifacts/rp2040-core/core-schematic.circuit.json
          git diff --exit-code -- artifacts/controller/unrouted.circuit.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root / 'artifacts/rp2040-core/supplier-provenance.json').read_text())
          for entry in manifest['files']:
              assert hashlib.sha256((root / entry['path']).read_bytes()).hexdigest() == entry['sha256'] == entry['reference_sha256'], entry['path']
          print('Original supplier and manufacturer inputs verified.')
          PY
