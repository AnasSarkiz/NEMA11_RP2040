name: NEMA11 offline source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nema11-offline-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-source:
    name: Two-layer prebuild source only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: boards/nema11-rp2040-two-layer--20261022-a1/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked source-check dependencies without lifecycle scripts
        run: npm ci --prefix boards/nema11-rp2040-two-layer--20261022-a1 --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check repository selection and two-layer source offline
        run: npm run verify:offline
      # Dependency installation fetches packages. All checks after it are local.
      # This workflow does not render circuits, route copper, export CAM, contact
      # a tscircuit service, or establish an electrical/mechanical hardware pass.
